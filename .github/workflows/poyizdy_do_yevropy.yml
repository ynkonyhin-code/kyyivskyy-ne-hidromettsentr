# ФАЙЛ: poyizdy_do_yevropy.yml | ПРОЄКТ: «Київський не гідрометцентр» | ЗАДАЧА: «Поїзди до Європи без пересадок» (щодня ~08:00)
# КУДИ КЛАСТИ: .github/workflows/poyizdy_do_yevropy.yml
# ПАРА (у корені репозиторію): poyizdy_do_yevropy.py, poyizdy_do_yevropy_card.py,
#                              poyizdy_do_yevropy_routes.json, requirements_poyizdy_do_yevropy.txt
name: Kyiv Poyizdy Do Yevropy

on:
  schedule:
    # 08:10 по Києві: влітку (UTC+3) = 05:10 UTC, взимку (UTC+2) = 06:10 UTC.
    # Зайвий запуск скрипт сам відсікає (публікує лише коли у Києві 08:xx).
    - cron: "10 5,6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробний запуск: нічого не публікувати, картку можна скачати з Artifacts"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kyiv-poyizdy-do-yevropy
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements_poyizdy_do_yevropy.txt

      - name: Publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # ручний НЕ пробний запуск публікує одразу, навіть не о 08:00
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python poyizdy_do_yevropy.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save card preview (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: poyizdy-card-preview
          path: poyizdy_do_yevropy_card.png
