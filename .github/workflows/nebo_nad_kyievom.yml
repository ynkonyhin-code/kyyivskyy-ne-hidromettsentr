# ФАЙЛ: nebo_nad_kyievom.yml | ПРОЄКТ: «Київський не гідрометцентр» | ЗАДАЧА: «Небо над Києвом» (щодня ~16:05)
# КУДИ КЛАСТИ: .github/workflows/nebo_nad_kyievom.yml
# ПАРА (у корені репозиторію): nebo_nad_kyievom.py, nebo_nad_kyievom_card.py, requirements_nebo_nad_kyievom.txt
name: Kyiv Nebo Nad Kyievom

on:
  schedule:
    # 16:05 по Києву: влітку (UTC+3) = 13:05 UTC, взимку (UTC+2) = 14:05 UTC.
    # Зайвий запуск скрипт сам відсікає (публікує лише коли у Києві 16:xx).
    - cron: "5 13,14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробний запуск: нічого не публікувати, картку можна скачати з Artifacts"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kyiv-nebo-nad-kyievom
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_nebo_nad_kyievom.txt

      - name: Шрифти з кирилицею
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements_nebo_nad_kyievom.txt

      - name: Publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # ручний НЕ пробний запуск публікує одразу, навіть не о 16:00
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python nebo_nad_kyievom.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save card preview (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: nebo-card-preview
          path: nebo_nad_kyievom_card.png
