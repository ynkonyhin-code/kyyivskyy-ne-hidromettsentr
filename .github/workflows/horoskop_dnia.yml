# ФАЙЛ: horoskop_dnia.yml | ПРОЄКТ: «Київський не гідрометцентр» | ЗАДАЧА: «Гороскоп на сьогодні» (щодня ~07:00)
# КУДИ КЛАСТИ: .github/workflows/horoskop_dnia.yml
# ПАРА (у корені репозиторію): horoskop_dnia.py, horoskop_dnia_card.py, horoskop_dnia_texts.json, requirements_horoskop_dnia.txt
name: Kyiv Horoskop Dnia

on:
  schedule:
    # 07:10 по Києві: влітку (UTC+3) = 04:10 UTC, взимку (UTC+2) = 05:10 UTC.
    # Зайвий запуск скрипт сам відсікає (публікує лише коли у Києві 07:xx).
    - cron: "10 4,5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробний запуск: нічого не публікувати, картку можна скачати з Artifacts"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kyiv-horoskop-dnia
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements_horoskop_dnia.txt

      - name: Publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # ручний НЕ пробний запуск публікує одразу, навіть не о 07:00
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python horoskop_dnia.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save card preview (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: horoskop-card-preview
          path: horoskop_dnia_card.png
