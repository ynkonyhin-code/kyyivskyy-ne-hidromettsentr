# ФАЙЛ: anons_tayemnytsi_neba.yml | ПРОЄКТ: «Київський не гідрометцентр» | ЗАДАЧА: афіша «Таємниць неба» (двічі на день)
# КУДИ КЛАСТИ: .github/workflows/anons_tayemnytsi_neba.yml
# ПАРА (у корені репозиторію): anons_tayemnytsi_neba.py, anons_tayemnytsi_neba_overlay.json,
#                              anons_tayemnytsi_neba_poster_01.jpg, _02.jpg, _03.jpg, anons_tayemnytsi_neba_requirements.txt,
#                              а також yak_pratsyuye_pohoda_font.ttf (спільний шрифт)
# Бот має бути адміністратором каналу з правом видаляти повідомлення: скрипт видаляє попередню афішу.
name: Kyiv Anons Tayemnytsi Neba

on:
  schedule:
    # Ранок (08:00–08:30 за Києвом = 05:00–06:30 UTC влітку / 06:00–07:30 взимку) і вечір (20:30–21:00 = 17:30–19:00 UTC).
    # Точний час публікації щоразу інший — його визначає сам скрипт.
    - cron: "*/10 5-7 * * *"
    - cron: "*/10 17-19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробний запуск: нічого не публікувати, кадр афіші можна скачати з Artifacts"
        type: boolean
        default: true
      test_post:
        description: "Тест: надіслати афішу зараз (лише якщо dry_run вимкнено; стан не зберігається, попередня не видаляється)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kyiv-anons-tayemnytsi-neba
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: anons_tayemnytsi_neba_requirements.txt

      - name: Install dependencies
        run: pip install -r anons_tayemnytsi_neba_requirements.txt

      - name: Run anons_tayemnytsi_neba
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}   # необов'язковий секрет: куди надсилати тестові пости
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_POST: ${{ inputs.test_post }}
        run: python anons_tayemnytsi_neba.py

      - name: Save dry-run preview
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: anons-preview
          path: anons_tayemnytsi_neba_test.jpg
          if-no-files-found: ignore

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f anons_tayemnytsi_neba_state.json ]; then git add anons_tayemnytsi_neba_state.json; fi
          git diff --cached --quiet || (git commit -m "anons_tayemnytsi_neba: update state" && git pull --rebase origin "${{ github.ref_name }}" && git push)
