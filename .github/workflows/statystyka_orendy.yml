# ФАЙЛ: statystyka_orendy.yml | ПРОЄКТ: «Київський не гідрометцентр» | ЗАДАЧА: «Оренда квартир у Києві» (щомісяця)
# КУДИ КЛАСТИ: .github/workflows/statystyka_orendy.yml
# ПАРА (у корені репозиторію): statystyka_orendy.py, statystyka_orendy_card.py, requirements_orenda.txt
# Файл statystyka_orendy_state.json (історія місячних знімків) створюється скриптом і комітиться назад.
name: Kyiv Statystyka Orendy

on:
  schedule:
    # 1-го, 2-го і 3-го числа о 08:00 UTC (10:00–11:00 за Києвом). Якщо 1-го збір не вдався — спробує ще двічі;
    # коли місяць уже опубліковано, зайві запуски нічого не роблять (див. state-файл).
    - cron: "0 8 1,2,3 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробний запуск: нічого не публікувати; текст — у логах, картки й знімки HTML — в Artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: kyiv-statystyka-orendy
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_orenda.txt

      - name: Шрифти з кирилицею
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements_orenda.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # ручний НЕ пробний запуск публікує одразу, навіть якщо цей місяць уже виходив
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python statystyka_orendy.py ${{ inputs.dry_run && '--dry-run --debug' || '' }}

      - name: Save card preview (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: orenda-cards-preview
          path: |
            statystyka_orendy_card.png
            statystyka_orendy_card_2.png

      - name: Save debug snapshots (dry run or failure)
        if: failure() || inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: orenda-debug
          path: orenda_debug/
          if-no-files-found: ignore

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f statystyka_orendy_state.json ]; then git add statystyka_orendy_state.json; fi
          git diff --cached --quiet || (git commit -m "statystyka_orendy: update state" && git pull --rebase origin "${{ github.ref_name }}" && git push)
