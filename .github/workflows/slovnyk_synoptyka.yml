# ФАЙЛ: slovnyk_synoptyka.yml | ПРОЄКТ: «Київський не гідрометцентр» | ЗАДАЧА: «Словник синоптика» (середа й субота, 15:00 + 0–60 хв)
# КУДИ КЛАСТИ: .github/workflows/slovnyk_synoptyka.yml
# ПАРА (у корені репозиторію): slovnyk_synoptyka.py, slovnyk_synoptyka_data.py, requirements_rubryky.txt
# Файл slovnyk_synoptyka_state.json створюється скриптом і комітиться назад (потрібен permissions: contents: write).
name: Kyiv Slovnyk Synoptyka

on:
  schedule:
    # Середа (3) і субота (6). Вікно 12:00–14:59 UTC покриває 15:00–17:59 за Києвом влітку й 14:00–16:59 взимку;
    # точний час (15:00 + 0–60 хв) визначає сам скрипт.
    - cron: "*/10 12-14 * * 3,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробний запуск: показати слово в логах, нічого не публікувати й не зберігати"
        type: boolean
        default: true
      index:
        description: "Номер слова для перегляду/тесту, починаючи з 0 (порожньо = наступне за чергою)"
        type: string
        default: ""
      test_post:
        description: "Тест: надіслати слово в канал зараз (лише якщо dry_run вимкнено; стан не зберігається)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kyiv-slovnyk-synoptyka
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_rubryky.txt

      - name: Install dependencies
        run: pip install -r requirements_rubryky.txt

      - name: Run slovnyk_synoptyka
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TEST_POST: ${{ inputs.test_post }}
        run: python slovnyk_synoptyka.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.index != '' && format('--index {0}', inputs.index) || '' }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f slovnyk_synoptyka_state.json ]; then git add slovnyk_synoptyka_state.json; fi
          git diff --cached --quiet || (git commit -m "slovnyk_synoptyka: update state" && git pull --rebase origin "${{ github.ref_name }}" && git push)
