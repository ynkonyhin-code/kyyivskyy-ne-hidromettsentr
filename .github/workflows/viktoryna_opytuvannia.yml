# ФАЙЛ: viktoryna_opytuvannia.yml | ПРОЄКТ: «Київський не гідрометцентр» | ЗАДАЧА: «Вікторина» (неділя) і «Опитування» (понеділок), 18:00 + 0–45 хв
# КУДИ КЛАСТИ: .github/workflows/viktoryna_opytuvannia.yml
# ПАРА (у корені репозиторію): viktoryna_opytuvannia.py, viktoryna_opytuvannia_data.py, requirements_rubryky.txt
# Файл viktoryna_opytuvannia_state.json створюється скриптом і комітиться назад (потрібен permissions: contents: write).
name: Kyiv Viktoryna Opytuvannia

on:
  schedule:
    # Неділя (0) — вікторина, понеділок (1) — опитування; що саме, скрипт визначає за днем тижня.
    # Вікно 15:00–16:59 UTC покриває 18:00–19:59 за Києвом влітку й 17:00–18:59 взимку;
    # точний час (18:00 + 0–45 хв) визначає сам скрипт.
    - cron: "*/10 15-16 * * 0,1"
  workflow_dispatch:
    inputs:
      kind:
        description: "Що запустити вручну"
        type: choice
        options: [auto, quiz, poll]
        default: auto
      dry_run:
        description: "Пробний запуск: показати питання в логах, нічого не публікувати й не зберігати"
        type: boolean
        default: true
      index:
        description: "Номер питання для перегляду/тесту, починаючи з 0 (порожньо = наступне за чергою)"
        type: string
        default: ""
      test_post:
        description: "Тест: надіслати в канал зараз (лише якщо dry_run вимкнено; стан не зберігається)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kyiv-viktoryna-opytuvannia
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_rubryky.txt

      - name: Install dependencies
        run: pip install -r requirements_rubryky.txt

      - name: Run viktoryna_opytuvannia
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          KIND: ${{ inputs.kind }}
          INDEX: ${{ inputs.index }}
          TEST_POST: ${{ inputs.test_post }}
        run: python viktoryna_opytuvannia.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f viktoryna_opytuvannia_state.json ]; then git add viktoryna_opytuvannia_state.json; fi
          git diff --cached --quiet || (git commit -m "viktoryna_opytuvannia: update state" && git pull --rebase origin "${{ github.ref_name }}" && git push)
