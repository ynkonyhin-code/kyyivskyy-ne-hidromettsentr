# ФАЙЛ: kurs_kryptovalyut.yml | ПРОЄКТ: «Київський не гідрометцентр» | ЗАДАЧА: «Курс криптовалют» (щодня ~12:05)
# КУДИ КЛАСТИ: .github/workflows/kurs_kryptovalyut.yml
# ПАРА (у корені репозиторію): kurs_kryptovalyut.py, kurs_kryptovalyut_card.py, requirements_kurs_kryptovalyut.txt
name: Kyiv Kurs Kryptovalyut

on:
  schedule:
    # 12:05 по Києву: влітку (UTC+3) = 09:05 UTC, взимку (UTC+2) = 10:05 UTC.
    # Зайвий запуск скрипт сам відсікає (публікує лише коли у Києві 12:xx).
    - cron: "5 9,10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробний запуск: нічого не публікувати, картку можна скачати з Artifacts"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kyiv-kurs-kryptovalyut
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_kurs_kryptovalyut.txt

      - name: Шрифти з кирилицею
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements_kurs_kryptovalyut.txt

      - name: Publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Необов'язково: безкоштовний Demo-ключ CoinGecko (менше обмежень за ліміт запитів)
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # ручний НЕ пробний запуск публікує одразу, навіть не о 12:00
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python kurs_kryptovalyut.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save card preview (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: kryptovalyut-card-preview
          path: kurs_kryptovalyut_card.png
