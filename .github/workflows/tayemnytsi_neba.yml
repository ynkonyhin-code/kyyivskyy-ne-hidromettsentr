# ФАЙЛ: tayemnytsi_neba.yml | ПРОЄКТ: «Київський не гідрометцентр» | ЗАДАЧА: «Таємниці неба» (вт і пт, 18:00 + 0–60 хв)
# КУДИ КЛАСТИ: .github/workflows/tayemnytsi_neba.yml
# ПАРА (у корені репозиторію): tayemnytsi_neba.py, tayemnytsi_neba_data.py, tayemnytsi_neba_requirements.txt
# Файл tayemnytsi_neba_state.json створюється скриптом сам і комітиться назад (потрібен permissions: contents: write).
name: Kyiv Tayemnytsi Neba

on:
  schedule:
    # Вівторок і п'ятниця. Вікно 15:00–17:59 UTC покриває 18:00–20:30 за Києвом і влітку, і взимку;
    # точний час (18:00 + 0–60 хв) визначає сам скрипт.
    - cron: "*/10 15-17 * * 2,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробний запуск: показати випуск у логах, нічого не публікувати і не зберігати"
        type: boolean
        default: true
      test_post:
        description: "Тест: надіслати випуск у канал зараз (лише якщо dry_run вимкнено; стан не зберігається)"
        type: boolean
        default: false
      test_issue:
        description: "Номер випуску для тесту (порожньо = наступний за чергою)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: kyiv-tayemnytsi-neba
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tayemnytsi_neba_requirements.txt

      - name: Install dependencies
        run: pip install -r tayemnytsi_neba_requirements.txt

      - name: Run tayemnytsi_neba
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_POST: ${{ inputs.test_post }}
          TEST_ISSUE: ${{ inputs.test_issue }}
        run: python tayemnytsi_neba.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f tayemnytsi_neba_state.json ]; then git add tayemnytsi_neba_state.json; fi
          git diff --cached --quiet || (git commit -m "tayemnytsi_neba: update state" && git pull --rebase origin "${{ github.ref_name }}" && git push)
