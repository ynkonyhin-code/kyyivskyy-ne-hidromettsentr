# ФАЙЛ: sova_nichna_zmina.yml | ПРОЄКТ: «Київський не гідрометцентр» | ЗАДАЧА: «Сова-чергова» — нічна зміна 00:00–03:45
# КУДИ КЛАСТИ: .github/workflows/sova_nichna_zmina.yml
# ПАРА (у корені репозиторію): sova_nichna_zmina.py, sova_nichna_zmina_data.py, requirements_sova_nichna_zmina.txt,
#   sova_nich_kvadrat.png, sova_svitanok_kvadrat.png, а також shchodennyy_kalendar.py + shchodennyy_kalendar_data.py
#   (звідти береться час сходу сонця). Файл sova_nichna_zmina_state.json створюється скриптом і комітиться назад.
#
# СЛОТИ (за Києвом): open 00:00 · c1 01:15 · c2 02:30 · close 03:45. Усі пости — без звуку.
# Кожен слот стартує за ~20 хв до цілі, скрипт чекає до точної хвилини. Два cron на слот — літній і зимовий час;
# який слот зараз запущено, визначається за рядком cron (див. крок «Визначити слот»), зайвий запуск виходить одразу.
#
# ЩОБ ВІДКЛЮЧИТИ РУБРИКУ: Actions → «Сова-чергова» → «···» → Disable workflow.
name: Сова-чергова — нічна зміна

on:
  schedule:
    - cron: "40 20,21 * * *"    # open  — ціль 00:00
    - cron: "55 21,22 * * *"    # c1    — ціль 01:15
    - cron: "10 23,0 * * *"     # c2    — ціль 02:30
    - cron: "25 0,1 * * *"      # close — ціль 03:45
  workflow_dispatch:
    inputs:
      slot:
        description: "Який слот показати / опублікувати вручну"
        type: choice
        options: [open, c1, c2, close]
        default: open
      dry_run:
        description: "Пробний запуск: нічого не публікувати; текст — у логах"
        type: boolean
        default: true

permissions:
  contents: write            # потрібно, щоб закомітити sova_nichna_zmina_state.json

concurrency:
  group: sova-${{ github.event.schedule || inputs.slot }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Отримати репозиторій
        uses: actions/checkout@v4

      - name: Налаштувати Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_sova_nichna_zmina.txt

      - name: Встановити залежності
        run: pip install -r requirements_sova_nichna_zmina.txt

      - name: Визначити слот
        id: slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.slot }}
        run: |
          case "$SCHEDULE" in
            "40 20,21 * * *") S=open ;;
            "55 21,22 * * *") S=c1 ;;
            "10 23,0 * * *")  S=c2 ;;
            "25 0,1 * * *")   S=close ;;
            *) S="$MANUAL" ;;
          esac
          echo "slot=$S" >> "$GITHUB_OUTPUT"
          echo "Слот: $S"

      - name: Підготувати й опублікувати
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SLOT: ${{ steps.slot.outputs.slot }}
          DRY_IN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          ARGS="--slot $SLOT"
          if [ "$DRY_IN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # ручний НЕ пробний запуск публікує одразу, без очікування і без перевірки вікна часу
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_IN" != "true" ]; then ARGS="$ARGS --force"; fi
          python -u sova_nichna_zmina.py $ARGS

      - name: Зберегти стан
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f sova_nichna_zmina_state.json ]; then git add sova_nichna_zmina_state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "sova_nichna_zmina: update state"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              sleep 5
            done
          fi
