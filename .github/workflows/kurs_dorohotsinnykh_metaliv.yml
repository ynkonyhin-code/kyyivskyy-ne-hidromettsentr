# ФАЙЛ: kurs_dorohotsinnykh_metaliv.yml | ПРОЄКТ: «Київський не гідрометцентр» | ЗАДАЧА: «Курс дорогоцінних металів» (щодня ~11:05)
# КУДИ КЛАСТИ: .github/workflows/kurs_dorohotsinnykh_metaliv.yml
# ПАРА (у корені репозиторію): kurs_dorohotsinnykh_metaliv.py, kurs_dorohotsinnykh_metaliv_card.py, requirements_kurs_metaliv.txt
name: Kyiv Kurs Dorohotsinnykh Metaliv

on:
  schedule:
    # 11:05 по Києву: влітку (UTC+3) = 08:05 UTC, взимку (UTC+2) = 09:05 UTC.
    # Зайвий запуск скрипт сам відсікає (публікує лише коли у Києві 11:xx).
    - cron: "5 8,9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Пробний запуск: нічого не публікувати, картку можна скачати з Artifacts"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kyiv-kurs-dorohotsinnykh-metaliv
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_kurs_metaliv.txt

      - name: Шрифти з кирилицею
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements_kurs_metaliv.txt

      - name: Publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # ручний НЕ пробний запуск публікує одразу, навіть не об 11:00
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python kurs_dorohotsinnykh_metaliv.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save card preview (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: metaliv-card-preview
          path: kurs_dorohotsinnykh_metaliv_card.png
