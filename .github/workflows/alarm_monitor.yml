# ФАЙЛ: alarm_monitor.yml | ПРОЄКТ: «Київський не гідрометцентр» | ЗАДАЧА: тривога Київ / відбій
# КУДИ КЛАСТИ: .github/workflows/alarm_monitor.yml   (ПАРА: alarm_checker.py у корені репозиторію)
name: Kyiv Alarm Monitor

on:
  schedule:
    # Запуск каждые 30 минут. Каждый запуск работает ~50 минут и проверяет канал каждые 2 минуты,
    # а следующий ждёт в очереди (concurrency) и подхватывает работу без пауз.
    - cron: '*/30 * * * *'
  workflow_dispatch:       # ручной запуск
    inputs:
      dry_run:
        description: 'Пробный запуск: одна проверка, без отправки в канал и без сохранения состояния'
        type: boolean
        default: false

concurrency:
  group: alarm-monitor
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write      # нужно, чтобы сохранять alarm_state.json в репозиторий

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Alarm Monitor (loop, every 2 minutes)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SOURCE_CHANNEL: air_alert_ua          # канал-источник (без @)
          SOURCE_NAME: Повітряна тривога
          LOOP_MINUTES: ${{ inputs.dry_run && '0' || '50' }}
          POLL_SECONDS: '120'
          COMMIT_STATE: ${{ inputs.dry_run && '0' || '1' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python alarm_checker.py

      - name: Save state (fallback)
        if: always() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alarm_state.json || true
          git commit -m "Update alarm state" || true
          git pull --rebase || true
          git push || true
